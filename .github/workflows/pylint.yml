name: Python checks

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt pylint
    - name: Check core modules with Pylint
      run: |
        PYTHONPATH=. pylint --errors-only --disable=import-error \
          scripts/microclimate_statistics.py \
          scripts/microclimate_forecasting.py \
          scripts/microclimate_sensitivity.py \
          scripts/drydown_modeling.py
    - name: Run behavioural tests
      env:
        MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        LOKY_MAX_CPU_COUNT: "4"
      run: python -m unittest discover -s tests -v
